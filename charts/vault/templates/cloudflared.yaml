{{- /* When bridge.enabled, configure the Cloudflare Tunnel to point at the bridge service */ -}}
{{- /* ({{ include "vault.fullname" . }}-bridge:8080) instead of the vault service directly. */ -}}
{{- if .Values.cloudflared.enabled }}
{{- $secretName := .Values.cloudflared.existingSecret | default (printf "%s-cloudflared" (include "vault.fullname" .)) }}
{{- if and (not .Values.cloudflared.existingSecret) .Values.cloudflared.tunnelToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.cloudflared.secretKey }}: {{ .Values.cloudflared.tunnelToken | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault.fullname" . }}-cloudflared
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cloudflared
  template:
    metadata:
      labels:
        {{- include "vault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cloudflared
    spec:
      # The last workload in this chart still mounting one, and the one holding
      # the tunnel credential: whatever got into it got both a way out of the
      # cluster and a token for the API server. cloudflared calls no Kubernetes
      # API.
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: "{{ .Values.cloudflared.image.repository }}:{{ .Values.cloudflared.image.tag }}"
          args:
            - tunnel
            - run
          # The token is the tunnel's credential: anything holding it can stand
          # up a connector for this tunnel and receive the traffic meant for the
          # cluster. cloudflared reads it from TUNNEL_TOKEN on its own, so
          # "--token $(TUNNEL_TOKEN)" only added a copy in /proc/<pid>/cmdline,
          # readable by every process in the pod's PID namespace and by anything
          # that collects a process listing off the node.
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ .Values.cloudflared.secretKey }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
{{- end }}
