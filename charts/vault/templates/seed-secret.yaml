{{- if and .Values.seed.enabled (not .Values.seed.existingSecret) }}
# A Secret, not a ConfigMap. seed.users carries a cleartext password per user, so
# the rendered object held real credentials in a kind that is stored unencrypted
# in etcd unless the cluster opts in, is covered by no encryption-at-rest default,
# and is the kind every "let them read the config" role is granted without a
# second thought. The mount path and subPath in the Deployment are unchanged;
# only the source of the volume is.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vault.seedSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
type: Opaque
stringData:
  seed.json: |
    {{ dict "clients" .Values.seed.clients "users" .Values.seed.users | toJson }}
{{- end }}
