apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    # Exactly vault.selectorLabels, and deliberately not one label more.
    #
    # spec.selector is the only immutable field this chart writes. Every other
    # selector over these pods -- the Service, the NetworkPolicy, the PDB, the
    # ServiceMonitor -- does name app.kubernetes.io/component: vault, because a
    # selector is a subset match and without it they would also match the bridge
    # and honeypot pods. All four are patchable in place; that was verified on a
    # live cluster, where the failed upgrade below had still moved the Service
    # and the PDB to the component-scoped form.
    #
    # This one is not. Adding the component label here made `helm upgrade` from
    # every released chart fail outright:
    #
    #   Error: UPGRADE FAILED: cannot patch "v42-vault-auth" with kind
    #   Deployment: ... spec.selector: Invalid value: ...: field is immutable
    #
    # and left the release `failed` with the Service and ConfigMap already
    # patched -- a mixed state an operator has to roll back out of. The label
    # bought nothing here either: the ReplicaSet a Deployment creates selects on
    # pod-template-hash as well, and the bridge and honeypot pod templates hash
    # differently, so no pod of theirs was ever selectable by this Deployment.
    # What has to carry the label is the pod template below, and it has since
    # v0.9.9 -- which is why dropping it here costs no pod churn on upgrade.
    #
    # If some future change genuinely needs a narrower selector, it is a
    # breaking chart change: it needs the orphan-delete procedure in
    # docs/UPGRADING.md written and released with it, not discovered afterwards.
    matchLabels:
      {{- include "vault.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.seed.enabled }}
        # Hashed, never the values themselves: this annotation is readable by
        # anything that can read the pod.
        checksum/seed: {{ toJson .Values.seed | sha256sum }}
        {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "vault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vault
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vault.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ if and .Values.tls.enabled .Values.tls.certFile }}8443{{ else }}8080{{ end }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "vault.fullname" . }}
          env:
            - name: MASTER_KEY_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.masterKey }}"
            - name: DB_MIG_PASSWORD_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.dbMigPassword }}"
            - name: DB_APP_PASSWORD_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.dbAppPassword }}"
            - name: HMAC_SECRET_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.hmacSecret }}"
            {{- if .Values.secrets.keys.adminToken }}
            - name: ADMIN_TOKEN_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.adminToken }}"
            {{- end }}
            {{- if and (eq .Values.cache.backend "redis") .Values.secrets.keys.redisPassword }}
            - name: REDIS_PASS_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.redisPassword }}"
            {{- end }}
            {{- /*
            The root CA pool for the TLS dial to Redis, here rather than in the
            ConfigMap for the reason every _FILE variable above is here: it
            names a file, and the same value that names it is what mounts the
            bundle at that path further down, so there is no way to render one
            without the other. Unset leaves the pool to the host trust store,
            which the distroless runtime image fills with public roots only --
            enough for a managed Redis with a publicly trusted certificate, and
            not enough for an in-cluster issuer.
            */}}
            {{- if .Values.redis.tls.caFile }}
            - name: REDIS_TLS_CA_FILE
              value: {{ .Values.redis.tls.caFile | quote }}
            {{- end }}
            {{- if .Values.secrets.keys.signingKey }}
            - name: SIGNING_KEY_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.signingKey }}"
            {{- end }}
            {{- if .Values.secrets.keys.pepper }}
            - name: VAULT_PEPPER_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.pepper }}"
            {{- end }}
            {{- /*
            Optional credentials, each gating a whole capability that is
            otherwise off with nothing to show for it: without kmsRootKey the
            KMS envelope-unwrap endpoint is never mounted, without
            recoveryPublicKey account erasure escrows nothing and an erased
            account is gone for good, without smtpUser/smtpPass an
            authenticating relay refuses every message, and without
            sendgridApiKey the SendGrid provider silently is not the sender.
            Every one is empty by default, so the Secret an existing release
            already created is still the whole set its pod asks for.
            */}}
            {{- if .Values.secrets.keys.kmsRootKey }}
            - name: KMS_ROOT_KEY_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.kmsRootKey }}"
            {{- end }}
            {{- if .Values.secrets.keys.recoveryPublicKey }}
            - name: VAULT_RECOVERY_PUBLIC_KEY_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.recoveryPublicKey }}"
            {{- end }}
            {{- if .Values.secrets.keys.smtpUser }}
            - name: SMTP_USER_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.smtpUser }}"
            {{- end }}
            {{- if .Values.secrets.keys.smtpPass }}
            - name: SMTP_PASS_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.smtpPass }}"
            {{- end }}
            {{- if .Values.secrets.keys.sendgridApiKey }}
            - name: SENDGRID_API_KEY_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.sendgridApiKey }}"
            {{- end }}
            {{- if .Values.secrets.keys.oauthGoogleClientSecret }}
            - name: VAULT_OAUTH_GOOGLE_CLIENT_SECRET_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.oauthGoogleClientSecret }}"
            {{- end }}
            {{- if .Values.secrets.keys.oauthGithubClientSecret }}
            - name: VAULT_OAUTH_GITHUB_CLIENT_SECRET_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.oauthGithubClientSecret }}"
            {{- end }}
            {{- if .Values.secrets.keys.oauthFacebookClientSecret }}
            - name: VAULT_OAUTH_FACEBOOK_CLIENT_SECRET_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.oauthFacebookClientSecret }}"
            {{- end }}
            {{- range .Values.oidcProviders }}
            {{- if .secretKey }}
            - name: VAULT_OIDC_{{ upper (replace "-" "_" .name) }}_CLIENT_SECRET_FILE
              value: "{{ $.Values.secrets.mountPath }}/{{ .secretKey }}"
            {{- end }}
            {{- end }}
            {{- if and .Values.tls.enabled .Values.tls.certFile }}
            - name: VAULT_TLS_CERT_FILE
              value: {{ .Values.tls.certFile | quote }}
            - name: VAULT_TLS_KEY_FILE
              value: {{ .Values.tls.keyFile | quote }}
            {{- end }}
          volumeMounts:
            {{- include "vault.firstBootCredentialMount" . | nindent 12 }}
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
            {{- if and .Values.tls.enabled .Values.tls.secretName }}
            - name: tls
              mountPath: /etc/vault-tls
              readOnly: true
            {{- end }}
            {{- if .Values.redis.tls.caFile }}
            - name: redis-ca
              mountPath: {{ .Values.redis.tls.caFile | quote }}
              subPath: ca.pem
              readOnly: true
            {{- end }}
            {{- if .Values.seed.enabled }}
            - name: seed
              mountPath: /etc/vault/seed.json
              subPath: seed.json
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
      volumes:
        {{- include "vault.firstBootCredentialVolume" . | nindent 8 }}
        - name: secrets
          secret:
            secretName: {{ include "vault.secretName" . }}
        {{- if and .Values.tls.enabled .Values.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
        {{- end }}
        {{- if .Values.redis.tls.caFile }}
        {{- if and .Values.redis.tls.caSecretName .Values.redis.tls.caConfigMapName }}
        {{- fail "redis.tls.caSecretName and redis.tls.caConfigMapName are both set, and the CA bundle is mounted from exactly one volume. Pick the Secret or the ConfigMap; silently preferring one is how an operator ends up debugging a root CA they are certain they replaced." }}
        {{- end }}
        {{- if not .Values.redis.tls.caKey }}
        {{- fail "redis.tls.caFile is set and redis.tls.caKey is empty, so the volume would project no key and nothing would be mounted at that path. The binary opens REDIS_TLS_CA_FILE and refuses the cache connection when it cannot read it, which is a pod that never becomes Ready. Name the key holding the PEM bundle." }}
        {{- end }}
        # The bundle gets a volume of its own rather than a key in the
        # credentials Secret: a root CA is public material, and it is mounted at
        # the path redis.tls.caFile names, which is the same value
        # REDIS_TLS_CA_FILE carries above.
        - name: redis-ca
          {{- if .Values.redis.tls.caConfigMapName }}
          configMap:
            name: {{ .Values.redis.tls.caConfigMapName }}
            items:
              - key: {{ .Values.redis.tls.caKey }}
                path: ca.pem
          {{- else }}
          secret:
            secretName: {{ .Values.redis.tls.caSecretName | default (include "vault.secretName" .) }}
            items:
              - key: {{ .Values.redis.tls.caKey }}
                path: ca.pem
          {{- end }}
        {{- end }}
        {{- if .Values.seed.enabled }}
        - name: seed
          secret:
            secretName: {{ include "vault.seedSecretName" . }}
            defaultMode: 0400
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
