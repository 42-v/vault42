{{- if .Values.bridge.enabled }}
---
# Honeypot Vault ConfigMap — separate config pointing to honeypot DB
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vault.fullname" . }}-honeypot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot
data:
  VAULT_PROFILE: "honeypot"
  LISTEN_ADDR: {{ .Values.listenAddr | quote }}
  VAULT_ORIGIN: {{ .Values.origin | quote }}
  VAULT_APP_NAME: {{ .Values.appName | quote }}
  VAULT_AUTO_MIGRATE: "true"
  VAULT_TLS_ENABLED: "false"
  VAULT_PASSWORD_MIN_LENGTH: {{ .Values.passwordMinLength | quote }}
  VAULT_HIBP_CHECK: {{ .Values.hibpCheck | quote }}
  VAULT_EMAIL_FROM: {{ .Values.emailFrom | quote }}
  DB_HOST: "{{ include "vault.fullname" . }}-honeypot-postgres"
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.honeypotInstance.database.name | quote }}
  DB_SSLMODE: "disable"
  DB_MAX_CONNS: "10"
  VAULT_RATE_LIMIT_ENABLED: "true"
  CACHE_BACKEND: "memory"
  VAULT_SERVE_FRONTEND: "true"
  {{- if .Values.forceSecureCookies }}
  VAULT_FORCE_SECURE_COOKIES: {{ .Values.forceSecureCookies | quote }}
  {{- end }}
---
# Honeypot Vault Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault.fullname" . }}-honeypot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: honeypot
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.honeypotInstance | sha256sum }}
      labels:
        {{- include "vault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: honeypot
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vault-honeypot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "vault.fullname" . }}-honeypot
          env:
            - name: MASTER_KEY_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.masterKey }}"
            - name: DB_MIG_PASSWORD_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.dbMigPassword }}"
            - name: DB_APP_PASSWORD_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.dbAppPassword }}"
            - name: HMAC_SECRET_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.hmacSecret }}"
            {{- if .Values.secrets.keys.adminToken }}
            - name: ADMIN_TOKEN_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.secrets.keys.adminToken }}"
            {{- end }}
          volumeMounts:
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.honeypotInstance.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "vault.secretName" . }}
---
# Honeypot Vault Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}-honeypot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot
{{- end }}
