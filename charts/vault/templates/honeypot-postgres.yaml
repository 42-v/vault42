{{- if .Values.bridge.enabled }}
---
# Honeypot PostgreSQL PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vault.fullname" . }}-honeypot-postgres-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot-postgres
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.honeypotInstance.postgres.storage | default "1Gi" }}
---
# Honeypot PostgreSQL Init ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vault.fullname" . }}-honeypot-postgres-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot-postgres
data:
  01-roles.sh: |
    #!/bin/bash
    set -e
    APP_PASS=$(cat /run/secrets/db-app-password)
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
      DO \$\$ BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'vault_app') THEN
          CREATE ROLE vault_app WITH LOGIN PASSWORD '${APP_PASS}';
        END IF;
      END \$\$;
      GRANT CONNECT ON DATABASE {{ .Values.honeypotInstance.database.name }} TO vault_app;
    EOSQL
---
# Honeypot PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vault.fullname" . }}-honeypot-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app: honeypot-postgres
    app.kubernetes.io/component: honeypot-postgres
spec:
  serviceName: {{ include "vault.fullname" . }}-honeypot-postgres
  replicas: 1
  selector:
    matchLabels:
      app: honeypot-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: honeypot-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "vault.serviceAccountName" . }}
      automountServiceAccountToken: false
      # This pod had no securityContext of any kind: no user, no seccomp profile,
      # no dropped capabilities, no resource bounds. It is the database behind the
      # honeypot, which is the one component in this chart an attacker is invited
      # to reach, and it was the least confined thing in it.
      securityContext:
        {{- include "vault.podSecurityContext" (dict "uid" 70 "gid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ include "vault.image" (dict "image" .Values.postgres.image "repository" "postgres" "tag" "17-alpine") }}"
          securityContext:
            {{- include "vault.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.honeypotInstance.database.name | quote }}
            - name: POSTGRES_USER
              value: vault_mig
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vault.honeypotSecretName" . }}
                  key: {{ .Values.secrets.keys.dbMigPassword }}
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
            # A subdirectory, matching the real postgres StatefulSet. The mount
            # root arrives owned by the volume's original uid with fsGroup as its
            # group, so a non-root postgres cannot chmod it to the 0700 initdb
            # insists on; a subdirectory it creates itself is owned by it. Without
            # this the pod starts as uid 70 and then fails to initialise.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml (.Values.honeypotInstance.postgres.resources | default dict) | nindent 12 }}
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "vault_mig", "-d", {{ .Values.honeypotInstance.database.name | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "vault_mig", "-d", {{ .Values.honeypotInstance.database.name | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "vault_mig", "-d", {{ .Values.honeypotInstance.database.name | quote }}]
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vault.fullname" . }}-honeypot-postgres-data
        - name: init
          configMap:
            name: {{ include "vault.fullname" . }}-honeypot-postgres-init
            defaultMode: 0755
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # The honeypot database's own credentials. This mounted the production
        # Secret, so the decoy's database held the password to the real one.
        - name: secrets
          secret:
            secretName: {{ include "vault.honeypotSecretName" . }}
            items:
              - key: {{ .Values.secrets.keys.dbAppPassword }}
                path: db-app-password
---
# Honeypot PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}-honeypot-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot-postgres
spec:
  selector:
    app: honeypot-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
