{{- if .Values.bridge.enabled }}
---
# Bridge ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vault.fullname" . }}-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: bridge
data:
  BRIDGE_LISTEN_ADDR: {{ .Values.bridge.listenAddr | quote }}
  BRIDGE_REAL_UPSTREAM: "http://{{ include "vault.fullname" . }}:{{ .Values.service.port }}"
  BRIDGE_HONEYPOT_UPSTREAM: "http://{{ include "vault.fullname" . }}-honeypot:{{ .Values.service.port }}"
  BRIDGE_RATE_THRESHOLD: {{ .Values.bridge.rateThreshold | quote }}
  BRIDGE_LOGIN_FAIL_THRESHOLD: {{ .Values.bridge.loginFailThreshold | quote }}
  BRIDGE_FLAG_TTL: {{ .Values.bridge.flagTTL | quote }}
  BRIDGE_FLAG_THRESHOLD: {{ .Values.bridge.flagThreshold | quote }}
  BRIDGE_LOG_LEVEL: {{ .Values.bridge.logLevel | quote }}
  {{- if .Values.bridge.webhookURL }}
  BRIDGE_WEBHOOK_URL: {{ .Values.bridge.webhookURL | quote }}
  {{- end }}
  {{- if .Values.bridge.trustedProxies }}
  BRIDGE_TRUSTED_PROXIES: {{ .Values.bridge.trustedProxies | quote }}
  {{- end }}
  {{- if .Values.bridge.realIPHeader }}
  BRIDGE_REAL_IP_HEADER: {{ .Values.bridge.realIPHeader | quote }}
  {{- end }}
  {{- if .Values.bridge.redis.enabled }}
  BRIDGE_REDIS_ADDR: {{ .Values.bridge.redis.addr | quote }}
  {{- end }}
---
# Bridge Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault.fullname" . }}-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vault.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bridge
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson .Values.bridge | sha256sum }}
      labels:
        {{- include "vault.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bridge
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vault.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bridge
          image: "{{ include "vault.image" (dict "image" .Values.bridge.image "tag" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.bridge.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "vault.fullname" . }}-bridge
          {{- if .Values.bridge.adminTokenKey }}
          env:
            - name: BRIDGE_ADMIN_TOKEN_FILE
              value: "{{ .Values.secrets.mountPath }}/{{ .Values.bridge.adminTokenKey }}"
          volumeMounts:
            - name: secrets
              mountPath: {{ .Values.secrets.mountPath }}
              readOnly: true
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.bridge.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /bridge/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /bridge/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /bridge/readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      {{- if .Values.bridge.adminTokenKey }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ include "vault.secretName" . }}
            # Project the one key the bridge reads, not the whole Secret.
            # cmd/bridge reads exactly one secret file, BRIDGE_ADMIN_TOKEN_FILE;
            # everything else it needs arrives through the ConfigMap above. A
            # bare secretName mounts every key in that Secret -- the signing key,
            # the master key, the HMAC secret, the database password and the
            # pepper -- into the one workload in this chart that is deliberately
            # exposed to attackers. The bridge is the deception proxy: being
            # reached by hostile traffic is its job, so it is the last container
            # that should be able to read the rest of the deployment's crypto
            # material.
            items:
              - key: {{ .Values.bridge.adminTokenKey }}
                path: {{ .Values.bridge.adminTokenKey }}
      {{- end }}
---
# Bridge Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}-bridge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app.kubernetes.io/component: bridge
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "vault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: bridge
{{- end }}
