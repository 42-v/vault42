{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vault.fullname" . }}-postgres-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
data:
  # The second here-document ended `  EOSQL`, indented. `<<-` strips leading
  # tabs, not spaces, so it was never terminated -- and because bash parses the
  # whole file before running any of it, the unterminated one took the entire
  # script down with a syntax error. postgres.enabled: true therefore never got
  # past initdb in any profile: the entrypoint runs this under `set -e`, so the
  # container exited 2 before it ever accepted a connection. The delimiter below
  # sits at column zero, which is the only position that ends a here-document
  # opened without the tab-stripping form.
  01-roles.sh: |
    #!/bin/bash
    set -e

    # Doubling a single quote is how a SQL string literal escapes one. These
    # passwords come from a mounted Secret, and one containing a quote either
    # failed to parse or closed the literal early and left the remainder of it
    # being read as SQL.
    sql_literal() {
      printf '%s' "$1" | sed "s/'/''/g"
    }

    create_role() {
      role="$1"
      pass="$2"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
    DO \$\$ BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${role}') THEN
        CREATE ROLE ${role} WITH LOGIN PASSWORD '$(sql_literal "$pass")';
      END IF;
    END \$\$;
    GRANT CONNECT ON DATABASE {{ .Values.database.name }} TO ${role};
    EOSQL
    }

    create_role vault_app "$(cat /run/secrets/db-app-password)"

    # Mounted only when the admin gateway is enabled.
    if [ -f /run/secrets/db-admin-password ]; then
      create_role vault_admin "$(cat /run/secrets/db-admin-password)"
    fi
{{- end }}
