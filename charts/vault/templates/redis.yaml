{{- if .Values.redis.enabled }}
{{- $requirePassword := ne (.Values.secrets.keys.redisPassword | default "") "" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vault.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app: redis
# The settings that used to be command-line flags. A config file is what lets
# requirepass arrive through an include instead of through argv, and the rest
# moved with it so there is one place to read the running configuration from.
# Persistence is deliberately not named here, so redis keeps the same built-in
# save rules it had when it was started with flags alone.
data:
  redis.conf: |
    maxmemory {{ .Values.redis.maxMemory | default "64mb" }}
    maxmemory-policy allkeys-lru
{{- if $requirePassword }}
    include /run/redis/requirepass.conf
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "vault.serviceAccountName" . }}
      automountServiceAccountToken: false
      # uid 999, gid 1000. redis:7-alpine puts the redis user in group 1000, not
      # 999; runAsGroup: 999 named a group the process is not in, and fsGroup
      # followed it, so every volume redis writes was owned by a group it did not
      # have.
      securityContext:
        {{- include "vault.podSecurityContext" (dict "uid" 999 "gid" 1000) | nindent 8 }}
      containers:
        - name: redis
          image: "{{ include "vault.image" (dict "image" .Values.redis.image "repository" "redis" "tag" "7-alpine") }}"
          ports:
            - containerPort: 6379
              name: redis
{{- if $requirePassword }}
          # The password reaches redis as a config file it reads at startup,
          # never as an argument. kubelet expands $(VAR) before exec, so
          # "--requirepass $(REDIS_PASSWORD)" put the cleartext password in
          # /proc/<pid>/cmdline, where every process in the pod's PID namespace
          # and anything on the node that can read that namespace could take it,
          # and where a crash dump or a ps in a debug sidecar records it.
          #
          # umask keeps the written file unreadable to anything but redis, and
          # the double-quoted form with backslashes escaped is what makes a
          # password containing a space or a quote parse back to itself.
          command:
            - sh
            - -c
            - |
              umask 077
              printf 'requirepass "%s"\n' "$(sed 's/[\\"]/\\&/g' /run/secrets/redis-password)" > /run/redis/requirepass.conf
              exec redis-server /etc/redis/redis.conf
{{- else }}
          command:
            - redis-server
            - /etc/redis/redis.conf
{{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            # redis keeps the built-in save rules, so it writes dump.rdb into its
            # working directory. On a read-only root that write fails, and with
            # stop-writes-on-bgsave-error the cache then starts refusing writes --
            # a failure that surfaces as the vault losing its cache rather than as
            # anything pointing here. emptyDir because none of it is meant to
            # outlive the pod.
            - name: data
              mountPath: /data
{{- if $requirePassword }}
            - name: password
              mountPath: /run/secrets
              readOnly: true
            - name: runtime
              mountPath: /run/redis
{{- end }}
          securityContext:
            {{- include "vault.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          resources:
            {{- toYaml (.Values.redis.resources | default dict) | nindent 12 }}
          # Unauthenticated, on purpose. With requirepass set this answers NOAUTH,
          # which is a live server replying, and redis-cli exits 0 on it. Passing
          # -a would put the password back into /proc/<pid>/cmdline, which is
          # exactly what the command above was written to avoid.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap:
            name: {{ include "vault.fullname" . }}-redis
        - name: data
          emptyDir: {}
{{- if $requirePassword }}
        # Only the one key. The release Secret also holds the master key, the
        # HMAC secret and the pepper, and redis has no business being able to
        # read any of them.
        - name: password
          secret:
            secretName: {{ include "vault.secretName" . }}
            items:
              - key: {{ .Values.secrets.keys.redisPassword }}
                path: redis-password
        # Memory-backed so the generated requirepass file never reaches a disk.
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  selector:
    app: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
