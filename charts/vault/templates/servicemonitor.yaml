{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vault.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.metrics.serviceMonitor.namespaceSelector }}
  namespaceSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vault.selectorLabels" . | nindent 6 }}
      # A selector is a subset match, and in bridge mode selectorLabels alone
      # also match the bridge and honeypot Services, so Prometheus would scrape
      # the decoy and file its counters under the vault. Name the component, as
      # service.yaml and networkpolicy.yaml do for the same reason.
      app.kubernetes.io/component: vault
  endpoints:
    # The metrics port, not http. /metrics is no longer a route on the public
    # listener; scraping port http now reaches a mux that does not serve it.
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
{{- end }}
