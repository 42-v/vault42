apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "vault.selectorLabels" . | nindent 4 }}
    # A Service selector is a subset match: selectorLabels alone also match the
    # bridge and honeypot pods (same name + instance labels), so in bridge mode
    # the Service would round-robin real traffic onto the honeypot. Name the
    # component, as networkpolicy.yaml does for the same reason.
    app.kubernetes.io/component: vault
