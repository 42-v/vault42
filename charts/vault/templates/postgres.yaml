{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vault.fullname" . }}-postgres-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage | default "1Gi" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vault.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app: postgres
spec:
  serviceName: {{ include "vault.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "vault.serviceAccountName" . }}
      automountServiceAccountToken: false
      # 70, not 999. 999 is the postgres GID in the Debian-based image; this
      # chart pins postgres:17-alpine, where postgres is uid and gid 70. The old
      # fsGroup: 999 named a group the container did not have, and it only ever
      # worked because nothing here said runAsNonRoot: the container started as
      # root and the entrypoint chowned PGDATA before dropping privileges. Adding
      # runAsUser without correcting the group is the change that would have
      # taken the database down.
      securityContext:
        {{- include "vault.podSecurityContext" (dict "uid" 70 "gid" 70) | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ include "vault.image" (dict "image" .Values.postgres.image "repository" "postgres" "tag" "17-alpine") }}"
          securityContext:
            {{- include "vault.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: vault_mig
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vault.secretName" . }}
                  key: {{ .Values.secrets.keys.dbMigPassword }}
            - name: POSTGRES_INITDB_ARGS
              value: "--auth-host=scram-sha-256"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # A read-only root filesystem leaves postgres two paths it genuinely
          # has to write: the unix socket directory it advertises in
          # unix_socket_directories, and /tmp, which initdb and the statistics
          # collector use. Both are emptyDir because nothing in either survives a
          # restart. /var/run is a symlink to /run in this image, so the mount
          # lands on /run/postgresql, which is the same directory.
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml (.Values.postgres.resources | default dict) | nindent 12 }}
          # -h 127.0.0.1 on purpose. During initdb the entrypoint runs a
          # temporary server with listen_addresses empty, reachable on the socket
          # but not on TCP, so a socket probe reports the database ready while the
          # role and grant scripts are still running. TCP is what the vault
          # actually connects on, so it is what readiness should mean.
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "vault_mig", "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "vault_mig", "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "vault_mig", "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vault.fullname" . }}-postgres-data
        - name: init
          configMap:
            name: {{ include "vault.fullname" . }}-postgres-init
            defaultMode: 0755
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: {{ include "vault.secretName" . }}
            items:
              - key: {{ .Values.secrets.keys.dbAppPassword }}
                path: db-app-password
              {{- if .Values.adminGateway.enabled }}
              - key: {{ .Values.adminGateway.dbAdminPasswordKey }}
                path: db-admin-password
              {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  selector:
    app: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
