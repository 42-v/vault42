{{- if .Values.mailpit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vault.fullname" . }}-mailpit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
    app: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailpit
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: mailpit
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "vault.serviceAccountName" . }}
      automountServiceAccountToken: false
      # The image declares no USER, so it defaulted to root, and it was pulled
      # from a tag the registry can move under a running pod. 65534 is nobody,
      # which exists in the image; mailpit is a static binary that owns nothing
      # on disk, so any non-root uid serves. It keeps messages in memory unless
      # MP_DATABASE names a file, which is why /tmp is the only writable path it
      # is given.
      securityContext:
        {{- include "vault.podSecurityContext" (dict "uid" 65534 "gid" 65534) | nindent 8 }}
      containers:
        - name: mailpit
          image: "{{ include "vault.image" (dict "image" .Values.mailpit.image "repository" "axllent/mailpit") }}"
          securityContext:
            {{- include "vault.containerSecurityContext" (dict "readOnlyRootFilesystem" true) | nindent 12 }}
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: web
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml (.Values.mailpit.resources | default dict) | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}-mailpit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  selector:
    app: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: web
      port: 8025
      targetPort: 8025
{{- if .Values.mailpit.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vault.fullname" . }}-mailpit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  {{- if .Values.mailpit.ingress.className }}
  ingressClassName: {{ .Values.mailpit.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.mailpit.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vault.fullname" . }}-mailpit
                port:
                  number: 8025
{{- end }}
{{- end }}
