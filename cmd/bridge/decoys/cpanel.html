<!DOCTYPE html>
<html>
<head><title>cPanel Login</title>
<style>
body{background:linear-gradient(135deg,#0d47a1,#1565c0);font-family:Roboto,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:8px;padding:40px;width:360px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.logo{text-align:center;margin-bottom:24px;font-size:28px;font-weight:700;color:#0d47a1}
label{display:block;margin-bottom:4px;font-size:13px;color:#555}
input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid #ddd;border-radius:4px;margin-bottom:16px;box-sizing:border-box;font-size:14px}
.btn{width:100%;background:#ff6d00;color:#fff;border:none;padding:12px;font-size:15px;border-radius:4px;cursor:pointer}
</style></head>
<body>
<div class="login-box">
<div class="logo">cPanel</div>
<form method="post">
<label>Username</label><input type="text" name="user" autocomplete="username" />
<label>Password</label><input type="password" name="pass" autocomplete="current-password" />
<button type="submit" class="btn">Log in</button>
</form>
</div></body></html>
