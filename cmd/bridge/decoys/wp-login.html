<!DOCTYPE html>
<html>
<head><title>Log In &lsaquo; WordPress</title>
<style>
body{background:#f1f1f1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0}
#login{width:320px;margin:8% auto;padding:20px 0}
.login h1{text-align:center;margin-bottom:24px}
.login h1 a{background-image:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4NCIgaGVpZ2h0PSI4NCIgdmlld0JveD0iMCAwIDg0IDg0Ij48cmVjdCB3aWR0aD0iODQiIGhlaWdodD0iODQiIGZpbGw9IiMyMTc1OWIiIHJ4PSI0MiIvPjx0ZXh0IHg9IjQyIiB5PSI1NiIgZm9udC1zaXplPSI0OCIgZm9udC1mYW1pbHk9IkFyaWFsIiBmaWxsPSIjZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5XPC90ZXh0Pjwvc3ZnPg==);width:84px;height:84px;display:block;margin:0 auto;background-size:84px;text-indent:-9999px;overflow:hidden}
#loginform{background:#fff;border:1px solid #c3c4c7;border-radius:4px;padding:26px 24px;margin-top:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
label{display:block;margin-bottom:3px;font-size:14px;color:#1e1e1e}
input[type=text],input[type=password]{width:100%;padding:3px 5px;margin:2px 6px 16px 0;font-size:24px;border:1px solid #8c8f94;border-radius:4px;box-sizing:border-box}
.button-primary{background:#2271b1;border-color:#2271b1;color:#fff;padding:4px 20px;font-size:13px;border-radius:3px;cursor:pointer;display:inline-block;line-height:2.15;min-height:32px}
</style></head>
<body class="login">
<div id="login">
<h1><a href="#">WordPress</a></h1>
<form id="loginform" method="post">
<p><label for="user_login">Username or Email Address</label>
<input type="text" name="log" id="user_login" autocomplete="username" /></p>
<p><label for="user_pass">Password</label>
<input type="password" name="pwd" id="user_pass" autocomplete="current-password" /></p>
<p class="submit"><input type="submit" class="button-primary" value="Log In" /></p>
</form>
</div></body></html>
