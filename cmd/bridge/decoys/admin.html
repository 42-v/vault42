<!DOCTYPE html>
<html>
<head><title>Admin Login</title>
<style>
body{background:#1a1a2e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#16213e;border-radius:8px;padding:40px;width:340px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
h2{color:#e94560;text-align:center;margin:0 0 24px;font-size:22px}
label{display:block;margin-bottom:4px;font-size:13px;color:#aaa}
input[type=text],input[type=password]{width:100%;padding:10px;background:#0f3460;border:1px solid #333;border-radius:4px;margin-bottom:16px;color:#fff;box-sizing:border-box;font-size:14px}
.btn{width:100%;background:#e94560;color:#fff;border:none;padding:12px;font-size:15px;border-radius:4px;cursor:pointer}
</style></head>
<body>
<div class="login-box">
<h2>Admin Panel</h2>
<form method="post">
<label>Username</label><input type="text" name="username" autocomplete="username" />
<label>Password</label><input type="password" name="password" autocomplete="current-password" />
<button type="submit" class="btn">Sign In</button>
</form>
</div></body></html>
