# OpenSSF Scorecard.
#
# The release notes for 1.0.0 claimed a Scorecard score, and nothing in the
# repository produced one: no workflow, no badge, no stored result, and
# api.securityscorecards.dev had never seen this project. A score nobody can
# reproduce is not evidence, so the claim is replaced by the run.
#
# The result is uploaded as SARIF so it lands in the Security tab and moves with
# the code, and published to the OpenSSF API so the badge in README.md resolves
# for anyone who has never cloned this repository.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly. Scorecard reads repository configuration and dependency metadata
    # that change on their own schedule rather than on ours, so a push trigger
    # alone would report a stale posture between releases.
    - cron: '41 5 * * 2'
  push:
    branches:
      - main

permissions: read-all

# Runners are pinned to ubuntu-24.04, not ubuntu-latest: that label moves to
# Ubuntu 26 from 2026-10-19, and a new runner image should arrive as a
# reviewed diff rather than as a red build nobody changed anything for.
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload the SARIF result to the code-scanning dashboard.
      security-events: write
      # Publish the result to the OpenSSF API, which is what makes the score
      # verifiable by someone outside this repository.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v3
        with:
          sarif_file: results.sarif
