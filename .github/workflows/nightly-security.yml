name: Security Scan

# Also the security gate for pull requests and for the release ref: ci.yml and
# release.yml call this workflow instead of copying its jobs, so a PR cannot
# introduce a HIGH CVE that only surfaces on main at 03:00 the next day.
#
# `full_scan` adds the image builds and the attack suite. Off for pull requests,
# where they are the slowest jobs and the source scans carry the signal; on for
# the nightly and for a release.
on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Also build and scan images, and run the attack suite'
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_scan:
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run gosec
        run: gosec -fmt json -out gosec-results.json ./... || true

      - name: Check findings
        run: |
          if [ -s gosec-results.json ]; then
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          issues = data.get('Issues', [])
          high = [i for i in issues if i.get('severity') in ('HIGH', 'CRITICAL')]
          if high:
              for i in high:
                  print(f\"[{i['severity']}] {i['details']} in {i['file']}:{i['line']}\")
              sys.exit(1)
          print(f'No HIGH/CRITICAL findings ({len(issues)} total issues)')
          " < gosec-results.json
          fi

  trivy-source:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  trivy-image:
    name: Trivy Image Scan
    if: github.event_name == 'schedule' || inputs.full_scan
    runs-on: ubuntu-latest
    strategy:
      # One flaky Docker Hub read must not cancel the sibling image's scan.
      fail-fast: false
      matrix:
        include:
          - name: vault
            dockerfile: Dockerfile
            tag: vault:scan
          - name: admin-gateway
            dockerfile: Dockerfile.admin-gateway
            tag: vault-admin-gateway:scan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build ${{ matrix.name }} image for scanning
        run: scripts/ci-build-image.sh ${{ matrix.tag }} ${{ matrix.dockerfile }} .

      - name: Run Trivy (${{ matrix.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          severity: HIGH,CRITICAL
          exit-code: 1

  attack-suite:
    name: Attack Test Suite
    if: github.event_name == 'schedule' || inputs.full_scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run attack tests
        run: go test ./tests/attack/... -count=1 -v -timeout 300s
