name: Security Scan

# Also the security gate for pull requests and for the release ref: ci.yml and
# release.yml call this workflow instead of copying its jobs, so a PR cannot
# introduce a HIGH CVE that only surfaces on main at 03:00 the next day.
#
# `full_scan` adds the image builds and the attack suite. Off for pull requests,
# where they are the slowest jobs and the source scans carry the signal; on for
# the nightly and for a release.
on:
  schedule:
    - cron: '0 3 * * *' # 3 AM UTC daily
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Also build and scan images, and run the attack suite'
        type: boolean
        default: true
  workflow_call:
    inputs:
      full_scan:
        type: boolean
        default: false
        required: false

permissions:
  contents: read

# This is a reusable workflow, called by both ci.yml and release.yml as well as
# run on its own cron, and inside a called workflow `github.workflow`,
# `github.ref` and `github.event_name` all resolve to the CALLER's. A group
# keyed on `github.ref` alone would therefore make a pull request's security
# run cancel a release's. All three keys are in the group so the three callers
# never collide.
#
# Cancellation is on for the nightly, which should never queue behind its own
# previous run, and for pull requests, where a force-push makes the run it
# replaces worthless. It is off for a tag push: a release's security gate must
# not be cancelled by anything.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: >-
    ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: govulncheck ./...

      # `./...` stops at a module boundary, so this job scanned the root module
      # and nothing else. tests/browser is a second module, and nothing in any
      # workflow ever looked at it: that is how its golang.org/x/sys sat on
      # v0.34.0, twelve minor versions behind the root module's and carrying
      # GO-2026-5024, without a single scan noticing.
      - name: Run govulncheck (nested modules)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find . -mindepth 2 -name go.mod \
            -not -path '*/node_modules/*' -not -path '*/vendor/*' -printf '%h\n')
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "no nested modules in the tree; nothing beyond the root scan to do"
            exit 0
          fi
          for dir in "${dirs[@]}"; do
            echo "==> govulncheck in $dir"
            ( cd "$dir" && govulncheck ./... )
          done

  gosec:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      # gosec exits non-zero on any finding at all, including the LOW and MEDIUM
      # ones this gate deliberately tolerates, so its exit status cannot be the
      # gate. The report is. That makes a scanner which produced no report the
      # dangerous case, and it used to be the silent one: the check was wrapped
      # in `if [ -s gosec-results.json ]`, so a gosec that crashed, ran out of
      # memory or failed to install wrote nothing, the guard evaluated false, and
      # the step exited green on a release-blocking path.
      - name: Run gosec
        run: gosec -fmt json -out gosec-results.json ./... || true

      - name: Check findings
        run: |
          set -euo pipefail
          if [ ! -s gosec-results.json ]; then
            echo "gosec produced no report at all. That is a failed scan, not a clean one." >&2
            exit 1
          fi
          python3 - gosec-results.json <<'PY'
          import json, sys

          try:
              with open(sys.argv[1]) as fh:
                  data = json.load(fh)
          except json.JSONDecodeError as exc:
              sys.exit(f"gosec report is not valid JSON, so the scan did not complete: {exc}")

          issues = data.get('Issues')
          if issues is None:
              sys.exit("gosec report has no Issues key; the report format changed "
                       "or the scan aborted midway")

          high = [i for i in issues if i.get('severity') in ('HIGH', 'CRITICAL')]
          for i in high:
              print(f"[{i['severity']}] {i['details']} in {i['file']}:{i['line']}")
          if high:
              sys.exit(f"{len(high)} HIGH/CRITICAL gosec finding(s)")
          print(f"No HIGH/CRITICAL findings ({len(issues)} total issues)")
          PY

  trivy-source:
    name: Trivy Source Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  trivy-image:
    name: Trivy Image Scan
    if: github.event_name == 'schedule' || inputs.full_scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One flaky Docker Hub read must not cancel the sibling image's scan.
      fail-fast: false
      matrix:
        include:
          - name: vault
            dockerfile: Dockerfile
            tag: vault:scan
          - name: admin-gateway
            dockerfile: Dockerfile.admin-gateway
            tag: vault-admin-gateway:scan
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Build ${{ matrix.name }} image for scanning
        run: scripts/ci-build-image.sh ${{ matrix.tag }} ${{ matrix.dockerfile }} .

      - name: Run Trivy (${{ matrix.name }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          severity: HIGH,CRITICAL
          exit-code: 1

  attack-suite:
    name: Attack Test Suite
    if: github.event_name == 'schedule' || inputs.full_scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run attack tests
        run: go test ./tests/attack/... -count=1 -v -timeout 300s
