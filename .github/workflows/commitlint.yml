name: Commit Lint

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  commitlint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Lint commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      # The action defaults to the conventional-commit-types list, which has no
      # `security`. commitlint.config.js does allow it, so a `security:` title
      # passed the commit check and failed the title check. The two lists have to
      # be the same list, or the gates contradict each other the way release.yml
      # and commitlint once did.
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
