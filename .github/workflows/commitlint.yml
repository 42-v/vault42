name: Commit Lint

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  commitlint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # This job used to `npm install -g @commitlint/cli
      # @commitlint/config-conventional` and then `npx commitlint`. Both resolve
      # "latest at run time", so a compromised release of either package would
      # have executed here on every pull request, and neither was in any
      # package.json: commitlint.config.js existed with nothing declaring the
      # tool it configures. Scorecard's only npmCommand finding in the repo.
      #
      # Both are root devDependencies now, so pnpm-lock.yaml pins them by
      # integrity hash and the same versions run in CI and on a developer's
      # machine.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The two SHAs were interpolated straight into the run body. They are
      # SHAs, so this was not exploitable, but binding them costs nothing and
      # removes the class.
      - name: Lint commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      # The action defaults to the conventional-commit-types list, which has no
      # `security`. commitlint.config.js does allow it, so a `security:` title
      # passed the commit check and failed the title check. The two lists have to
      # be the same list, or the gates contradict each other the way release.yml
      # and commitlint once did.
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
