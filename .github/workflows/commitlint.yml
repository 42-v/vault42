name: Commit Lint

on:
  pull_request:
    branches: [main]
    # edited is not decoration. Without it the title check runs only on open,
    # synchronize and reopen, so correcting a rejected title leaves the failed
    # run standing and the only way to re-run it is to push a commit. That is
    # what happened to the 1.0.4 release PR: the title was fixed within a minute
    # and the check stayed red on a title that no longer existed.
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: read

concurrency:
  group: commitlint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # This job used to `npm install -g @commitlint/cli
      # @commitlint/config-conventional` and then `npx commitlint`. Both resolve
      # "latest at run time", so a compromised release of either package would
      # have executed here on every pull request, and neither was in any
      # package.json: commitlint.config.js existed with nothing declaring the
      # tool it configures. Scorecard's only npmCommand finding in the repo.
      #
      # Both are root devDependencies now, so pnpm-lock.yaml pins them by
      # integrity hash and the same versions run in CI and on a developer's
      # machine.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The two SHAs were interpolated straight into the run body. They are
      # SHAs, so this was not exploitable, but binding them costs nothing and
      # removes the class.
      - name: Lint commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The action defaults to the conventional-commit-types list, which has no
      # `security`. commitlint.config.js does allow it, so a `security:` title
      # passed the commit check and failed the title check. The two lists have to
      # be the same list, or the gates contradict each other the way release.yml
      # and commitlint once did.
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            security
            compliance
