---
# yamllint configuration for vault42.
#
# Baseline before this file existed: 623 findings on .github/workflows, charts
# and k8s (1 083 counting the generated pnpm lockfile), because with no config
# yamllint applies its `default` preset to everything it can parse.

extends: default

ignore: |
  # Helm chart templates are Go templates, not YAML. `{{- if ... }}` on line 1
  # is a parse error to a YAML reader, and `{{ .Values.x }}` reads as a flow
  # mapping, which is where 278 `braces` and 21 `syntax` findings came from.
  # The right way to lint these is `helm template | yamllint -`, which the chart
  # already passes; running yamllint over the source templates cannot work.
  charts/*/templates/
  # Generated by pnpm. 446 findings, none of them anyone's to fix.
  pnpm-lock.yaml
  # Third-party and build output.
  node_modules/
  **/node_modules/
  **/dist/
  # Untracked local scratch (gitignored).
  tmp/
  .fleet/
  k8s/dev/

rules:
  # 80 is unworkable for GitHub Actions `run:` blocks and for Helm values with
  # image digests. 120 is the widest line the tracked YAML actually needs.
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # yamllint parses the Actions `on:` key as the YAML 1.1 boolean `on`. That
  # clash is in the schema GitHub defines, not in this repository, so key
  # truthiness is not checked. Values are still checked.
  truthy:
    check-keys: false

  # `---` carries no meaning in a single-document file and the repo is not
  # consistent about it. Not worth 38 edits to enforce a marker that changes
  # nothing.
  document-start: disable

  # One space before an inline `#` is the prevailing style in this tree and in
  # the workflow files GitHub's own docs generate.
  comments:
    require-starting-space: true
    min-spaces-from-content: 1

  # Accept both block-sequence styles as long as a file is internally
  # consistent; the workflows indent sequences, the chart values do not.
  indentation:
    spaces: consistent
    indent-sequences: consistent
