{{define "subject"}}Verify your email - {{.AppName}}{{end}}
{{define "content"}}
<h2 style="margin:0 0 16px;color:#ffffff;font-size:22px">Welcome to {{.AppName}}</h2>
<p style="margin:0 0 16px;color:#cccccc;font-size:15px;line-height:1.5">Click the button below to verify your email address:</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px">
<tr><td style="background-color:{{.PrimaryColor}};border-radius:6px;padding:12px 24px">
<a href="{{.URL | safeURL}}" style="color:#000000;text-decoration:none;font-size:15px;font-weight:600">Verify Email</a>
</td></tr>
</table>
<p style="margin:0 0 8px;color:#888888;font-size:13px">Or copy this link: {{.URL}}</p>
<p style="margin:0;color:#888888;font-size:13px">This link expires in 24 hours.</p>
{{end}}
