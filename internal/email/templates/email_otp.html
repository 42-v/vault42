{{define "subject"}}Your verification code - {{.AppName}}{{end}}
{{define "content"}}
<h2 style="margin:0 0 16px;color:#ffffff;font-size:22px">Verification Code</h2>
<p style="margin:0 0 16px;color:#cccccc;font-size:15px;line-height:1.5">Use the code below to complete your sign-in:</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px">
<tr><td style="background-color:{{.PrimaryColor}};border-radius:6px;padding:16px 32px;text-align:center">
<span style="color:#000000;font-size:28px;font-weight:700;letter-spacing:6px;font-family:monospace">{{.Code}}</span>
</td></tr>
</table>
<p style="margin:0 0 8px;color:#888888;font-size:13px">This code expires in 5 minutes.</p>
<p style="margin:0;color:#888888;font-size:13px">If you did not request this code, you can safely ignore this email.</p>
{{end}}
