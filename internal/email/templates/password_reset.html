{{define "subject"}}Password Reset - {{.AppName}}{{end}}
{{define "content"}}
<h2 style="margin:0 0 16px;color:#ffffff;font-size:22px">Password Reset</h2>
<p style="margin:0 0 16px;color:#cccccc;font-size:15px;line-height:1.5">Click the button below to reset your password:</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px">
<tr><td style="background-color:{{.PrimaryColor}};border-radius:6px;padding:12px 24px">
<a href="{{.URL | safeURL}}" style="color:#000000;text-decoration:none;font-size:15px;font-weight:600">Reset Password</a>
</td></tr>
</table>
<p style="margin:0 0 8px;color:#888888;font-size:13px">Or copy this link: {{.URL}}</p>
<p style="margin:0 0 8px;color:#888888;font-size:13px">This link expires in 1 hour.</p>
<p style="margin:0;color:#888888;font-size:13px">If you didn't request this, ignore this email.</p>
{{end}}
