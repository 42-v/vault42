# Release artifacts for the GitHub release: binaries, checksums, SBOMs and a
# detached cosign signature over the checksum file.
#
# Container images are NOT built here. `.github/workflows/release.yml` builds
# them with buildx so they keep their multi-arch index, BuildKit provenance and
# SPDX attestations, and their existing cosign keyless signatures.
#
# `release.disable` is on because softprops/action-gh-release owns the GitHub
# release object; goreleaser only produces dist/ and the workflow attaches it.
version: 2

project_name: vault42

before:
  hooks:
    - go mod download
    # The Vue dashboard is embedded with go:embed from internal/frontend/dist,
    # and only a placeholder index.html is tracked there. Without this the
    # release archives shipped that placeholder, so every downloaded binary
    # served a dashboard-less page while the images built from the Dockerfile
    # served a real one. Same version, two different products.
    #
    # `go install` still gets the placeholder, because it cannot run a hook.
    # That is why the placeholder is now a self-contained page that says so
    # rather than a copy of a real build referencing assets that are not there.
    - pnpm install --frozen-lockfile
    - pnpm -C packages/vue build
    - pnpm -C web build
    - bash -c 'rm -rf internal/frontend/dist && cp -r web/dist internal/frontend/dist'

# CGO_ENABLED=0, -trimpath, -s -w and mod_timestamp were already set on all
# three builds; -buildid= and -buildvcs=false are what actually close the gap to
# bit-for-bit reproducibility. Go derives a build ID from the action graph, which
# moves with the toolchain's cache state, and -buildvcs defaults to auto, which
# stamps VCS state including a dirty-tree flag that differs between a clean CI
# checkout and a local rebuild.
#
# Dropping the VCS stamp costs nothing here: main.Version, main.GitCommit and
# main.BuildTime are stamped explicitly below.
#
# This claim covers the binaries and the archives only. The three Dockerfiles use
# BuildKit cache mounts, so the images are not bit-reproducible and are not
# advertised as such.
builds:
  - id: vault
    main: ./cmd/vault
    binary: vault
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -buildid=
      - -X main.Version={{ .Version }}
      - -X main.GitCommit={{ .FullCommit }}
      - -X main.BuildTime={{ .CommitDate }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: bridge
    main: ./cmd/bridge
    binary: bridge
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    # The three stamps below have to match variables declared in cmd/bridge
    # itself. cmd/bridge is deliberately stdlib-only and links nothing under
    # internal/, so they cannot be borrowed from a shared package: a -X naming a
    # symbol the binary does not link is dropped by the linker without a warning
    # and with exit 0. That is exactly what happened here for every release
    # before 1.0.0, and this file read as though the bridge were stamped like
    # the other two binaries while it shipped reporting no version at all.
    # tests/spec/version_stamp_test.go keeps the two sides in agreement.
    ldflags:
      - -s -w
      - -buildid=
      - -X main.Version={{ .Version }}
      - -X main.GitCommit={{ .FullCommit }}
      - -X main.BuildTime={{ .CommitDate }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: admin-gateway
    main: ./cmd/admin-gateway
    binary: admin-gateway
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -buildid=
      - -X main.Version={{ .Version }}
      - -X main.GitCommit={{ .FullCommit }}
      - -X main.BuildTime={{ .CommitDate }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: vault42
    ids: [vault, bridge, admin-gateway]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # The archived server needs its schema and its mail templates; the embedded
    # SPA in cmd/vault is the development placeholder unless the tree was built
    # by Dockerfile or scripts/build-all.sh, which is documented in the release.
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - src: migrations/*
        dst: migrations
      - src: internal/email/templates/*
        dst: templates

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"

# Keyless blob signing over the checksum file. One signature covers every
# artifact, because every artifact's digest is in the file being signed.
signs:
  - id: cosign-checksum
    cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - --yes
      - --output-certificate=${certificate}
      - --output-signature=${signature}
      - ${artifact}

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

release:
  disable: true
