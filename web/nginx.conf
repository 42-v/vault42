# Static-file config for the optional nginx frontend image (web/Dockerfile).
#
# This is NOT the path a shipped vault serves its dashboard from. The Go binary
# embeds web/dist with go:embed and applies internal/middleware/security_headers
# to it; the chart's frontend Deployment is off by default. This file exists for
# the standalone image, and it is kept in step with the Go policy on purpose,
# because the two diverging is what made it dangerous.
#
# It used to carry the weakest CSP in the repository:
#
#   connect-src 'self' http://localhost:* https://*
#
# which permits fetch() to any HTTPS host on the internet. That matters more here
# than in most apps: the access token is deliberately held in JavaScript memory
# (packages/vue/src/client.ts) precisely so no XSS-reachable store exists, and
# `connect-src` is the directive that closes the remaining exfiltration channel.
# The wildcard reopened it. `style-src 'unsafe-inline'` was unnecessary too — the
# Go path omits it and the built bundle renders correctly, because the one
# dynamic style binding in the SPA is applied through CSSOM, which CSP does not
# gate.
#
# Anything relaxed here has to be justified against internal/middleware/
# security_headers.go, which is the policy users actually receive.

server {
    listen 3000;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Same shape as the Go path, plus base-uri and form-action,
    # which neither policy inherits from default-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    # Block source maps in production
    location ~* \.map$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
